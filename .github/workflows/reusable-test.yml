name: Reusable Test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout for validation
        required: false
        type: string
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js 26 (OpenTUI native FFI)
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
